<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الهروب من غرفة السايبر</title>
<style>
:root{--bg:#050b14;--panel:#0b1626ee;--line:#12304d;--g:#00ff9c;--c:#27d3ff;--r:#ff4d6d;--y:#ffd24d;--t:#d8ecff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font-family:Tahoma,"Segoe UI",Arial,sans-serif;min-height:100vh}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#rain{opacity:.35;z-index:0}#conf{z-index:5}
.wrap{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:18px}
h1{font-size:26px;margin:8px 0;color:var(--g);text-shadow:0 0 14px #00ff9c88;text-align:center}
.sub{text-align:center;color:var(--c);margin-bottom:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 0 30px #000a;backdrop-filter:blur(4px);animation:in .4s}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
.shake{animation:shake .4s}@keyframes shake{25%{transform:translateX(-9px)}50%{transform:translateX(9px)}75%{transform:translateX(-5px)}}
.flash{animation:flash .5s}@keyframes flash{30%{box-shadow:0 0 40px var(--g)}}
button{font:inherit;cursor:pointer}
.btn{background:var(--g);color:#032;border:0;border-radius:10px;padding:12px 22px;font-weight:bold;font-size:17px;width:100%;transition:.2s}
.btn:hover{filter:brightness(1.1);transform:translateY(-2px)}
input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#06101d;color:var(--t);font:inherit;margin:10px 0}
.hud{display:flex;justify-content:space-between;gap:8px;font-size:15px;margin-bottom:10px;color:var(--c)}
.hud b{color:var(--g);font-variant-numeric:tabular-nums}
.bar{height:6px;background:#06101d;border-radius:4px;overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--r),var(--y),var(--g))}
.doors{display:flex;gap:5px;margin-bottom:14px}
.door{flex:1;height:34px;border-radius:6px;border:1px solid var(--line);background:#06101d;display:flex;align-items:center;justify-content:center;font-size:15px}
.door.open{background:#00ff9c22;border-color:var(--g);animation:pop .5s}
@keyframes pop{50%{transform:scale(1.35) rotate(-8deg)}}
.door.cur{border-color:var(--c);box-shadow:0 0 10px var(--c)}
.q{font-size:20px;line-height:1.7;margin:6px 0 14px}
.opt{display:block;width:100%;text-align:right;background:#06101d;color:var(--t);border:1px solid var(--line);border-radius:10px;padding:13px;margin:8px 0;font-size:17px;transition:.2s;animation:in .3s backwards}
.opt:hover:not(:disabled){border-color:var(--c);transform:translateX(-4px)}
.opt.ok{background:#00ff9c33;border-color:var(--g)}
.opt.bad{background:#ff4d6d33;border-color:var(--r)}
.opt.gone{visibility:hidden}
.msg{min-height:24px;text-align:center;margin-top:8px;font-weight:bold}
.mini{width:100%;margin-top:10px;background:#06101d;color:var(--y);border:1px solid var(--line);border-radius:10px;padding:9px}
.mini:disabled{opacity:.4}
.big{font-size:44px;text-align:center;margin:6px 0;color:var(--g)}
.rank{text-align:center;font-size:22px;color:var(--y);margin:6px 0}
.hide{display:none}
.lb{margin-top:12px;font-size:15px}
.lb div{display:flex;justify-content:space-between;padding:6px 8px;border-bottom:1px solid var(--line)}
.lb .me{background:#00ff9c22;border-radius:6px}
.rv{background:#06101d;border-right:3px solid var(--r);border-radius:8px;padding:10px;margin:8px 0;font-size:15px;line-height:1.6}
.rv span{color:var(--g)}
#snd{position:fixed;top:10px;left:10px;z-index:9;background:#0b1626;border:1px solid var(--line);color:var(--t);border-radius:50%;width:40px;height:40px}
</style>
</head>
<body>
<canvas id="rain"></canvas><canvas id="conf"></canvas>
<button id="snd" onclick="toggleSound()" aria-label="الصوت">🔊</button>
<div class="wrap">
<h1>🔐 الهروب من غرفة السايبر</h1>
<div class="sub">مهمة إنقاذ النظام — والوقت يمر! <small style="opacity:.5">v6</small></div>

<div id="start" class="card">
<p>النظام تعرّض لاختراق وأنت محبوس داخل غرفة السايبر. افتح الأبواب بالإجابة الصحيحة. أسئلتك تُختار عشوائياً من بنك أكبر.</p>
<p id="rules"></p><div class="msg" id="notice" style="color:var(--y)"></div>
<input id="name" placeholder="اكتب اسمك" maxlength="20" autocomplete="off">
<input id="pin" class="hide" placeholder="🔑 رمز الدخول" maxlength="12" autocomplete="off">
<button class="btn" id="go" onclick="begin()">ابدأ المهمة</button>
<div class="lb" id="lb1"></div>
</div>

<div id="game" class="card hide">
<div class="hud"><span>الباب <b id="n">1</b>/<span id="nn">10</span></span><span>⏱️ <b id="time">0.0</b></span><span>⏳ <b id="qt">20</b></span><span>❌ <b id="err">0</b></span><span>🔥 <b id="stk">0</b></span></div>
<div class="bar"><i id="qbar"></i></div>
<div class="doors" id="doors"></div>
<div class="q" id="q"></div>
<div id="opts"></div>
<div class="msg" id="msg"></div>
<button class="mini" id="hint" onclick="hint()">💡 تلميح (2)</button>
</div>

<div id="end" class="card hide">
<div style="text-align:center;font-size:48px">🏆</div>
<h1>تم الهروب!</h1>
<div class="rank" id="rank"></div>
<div class="big" id="final"></div>
<div style="text-align:center" id="detail"></div>
<div class="lb" id="lb"></div>
<h3 style="color:var(--c)">📋 مراجعة أخطائك</h3>
<div id="review"></div>
<button class="btn" style="margin-top:16px" onclick="reset()">لاعب جديد</button>
</div>
</div>

<script>
let Q=[
["أي قانون حلّ محل قانون مكافحة التمييز ضد ذوي الإعاقة (DDA)؟",["قانون المساواة (Equality Act 2010)","قانون حماية البيانات","قانون إساءة استخدام الحاسوب","قانون حقوق النشر"]],
["ما المعايير الدولية التي تدير أمن المعلومات (ISMS)؟",["معايير ISO 27000","معايير ISO 9001","معايير ISO 14001","معايير ISO 45001"]],
["ما اسم إرشادات رابطة W3C لتسهيل وصول ذوي الإعاقة إلى الويب؟",["WCAG","HTML5","HTTP","CSS"]],
["ما الخطوة الأولى عند حدوث مشكلة تقنية حسب المخطط؟",["إنشاء تذكرة في مكتب الخدمة","إعادة تثبيت النظام","شراء جهاز جديد","تجاهل المشكلة وانتظار حلها"]],
["ما الذي يجرّمه قانون إساءة استخدام الحاسوب (Computer Misuse Act)؟",["الدخول غير المصرح به إلى أنظمة الحاسوب","استخدام الحاسوب في الدراسة","شراء برامج مرخصة","تحديث نظام التشغيل"]],
["ما الهدف الأساسي من لائحة GDPR؟",["حماية البيانات الشخصية للأفراد","زيادة سرعة الإنترنت","تنظيم أسعار الأجهزة","منع استخدام البريد الإلكتروني"]],
["ما هو هجوم التصيّد (Phishing)؟",["رسائل احتيالية تخدع المستخدم لسرقة معلوماته","تعطّل القرص الصلب","بطء الشبكة بسبب الازدحام","برنامج لتسريع الجهاز"]],
["ما وظيفة جدار الحماية (Firewall)؟",["مراقبة حركة الشبكة وحجب غير المسموح بها","تخزين الملفات احتياطياً","تسريع تحميل الصفحات","طباعة المستندات"]],
["لماذا نأخذ نسخة احتياطية (Backup) من البيانات؟",["لاسترجاع البيانات عند فقدانها أو تلفها","لزيادة حجم الذاكرة","لإخفاء الملفات","لتغيير كلمة المرور"]],
["ما فائدة المصادقة الثنائية (2FA)؟",["إضافة طبقة تحقق ثانية فوق كلمة المرور","جعل كلمة المرور أقصر","حذف الحسابات القديمة","تسريع تسجيل الدخول فقط"]],
["ما هو دور مكتب الخدمة (Service Desk)؟",["نقطة الاتصال الأولى لدعم المستخدمين وحل مشاكلهم التقنية","بيع الأجهزة للعملاء","إعداد الرواتب","تصميم الإعلانات"]],
["أي كلمة مرور هي الأقوى؟",["طويلة وتجمع أحرفاً وأرقاماً ورموزاً","تاريخ ميلادك","اسمك الأول","123456"]],
["ما هو البرنامج الخبيث (Malware)؟",["برنامج مصمم لإلحاق الضرر بالأجهزة أو سرقة البيانات","برنامج لتحرير الصور","برنامج لمشاهدة الفيديو","برنامج لإرسال البريد"]],
["ما هو برنامج الفدية (Ransomware)؟",["برنامج يشفّر ملفاتك ويطلب مالاً لفك التشفير","برنامج يسرّع الإنترنت","برنامج يحذف الملفات المكررة","برنامج يحمي من الفيروسات"]],
["ما هو النص البديل (Alt Text) للصور في الويب؟",["وصف نصي للصورة تقرؤه برامج قراءة الشاشة","اسم صاحب الصورة","حجم الصورة بالبكسل","رابط تحميل الصورة"]],
["ما المقصود بالتشفير (Encryption)؟",["تحويل البيانات إلى شكل غير مقروء إلا لمن يملك المفتاح","حذف الملفات نهائياً","ضغط الملفات لتصغير حجمها","نسخ الملفات إلى قرص آخر"]],
["ما هي الهندسة الاجتماعية (Social Engineering)؟",["خداع الأشخاص نفسياً لدفعهم للكشف عن معلومات سرية","تصميم الشبكات الكبيرة","برمجة المواقع الاجتماعية","صيانة أجهزة الحاسوب"]],
["ما معنى مبدأ أقل صلاحية (Least Privilege)؟",["إعطاء المستخدم الصلاحيات التي يحتاجها لعمله فقط","إعطاء الجميع صلاحية المدير","منع الجميع من استخدام النظام","مشاركة كلمة المرور بين الموظفين"]],
["ماذا يمثل الثالوث CIA في أمن المعلومات؟",["السرية والسلامة والتوافر","الحاسوب والإنترنت والتطبيقات","التحكم والتحقق والتشغيل","النسخ والتخزين والإرسال"]],
["ما فائدة التحديث الأمني (Security Patch)؟",["إصلاح ثغرة أمنية معروفة في البرنامج","تغيير شكل البرنامج فقط","حذف بيانات المستخدم","زيادة عدد الإعلانات"]]
];
let N=10,QT=20,PEN_W=10,PEN_T=10,HINTS=2,OPEN=true,SHOWLB=true,ANN="",SESSION=null,PINREQ=false;const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let sel,i,t0,qT0,active=false,errs,pen,name,streak,hints,total=0,localBoard=[],muted=false,ac;
function shuffle(a){a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
function show(id){["start","game","end"].forEach(x=>$(x).classList.toggle("hide",x!==id))}
function elapsed(){return Math.max(0,(Date.now()-t0)/1000+pen)}
function fx(el,c){el.classList.remove(c);void el.offsetWidth;el.classList.add(c)}

/* sound */
function beep(f,d,type,v,w){if(muted)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain(),s=ac.currentTime+(w||0);o.type=type||"sine";o.frequency.value=f;g.gain.setValueAtTime(v||.12,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(ac.destination);o.start(s);o.stop(s+d)}catch(e){}}
function toggleSound(){muted=!muted;$("snd").textContent=muted?"🔇":"🔊"}
const sOk=()=>{beep(660,.12);beep(990,.18,"sine",.12,.1)},sBad=()=>beep(140,.35,"sawtooth",.1),sWin=()=>[523,659,784,1046].forEach((f,k)=>beep(f,.25,"triangle",.14,k*.13));

/* matrix rain */
const rc=$("rain"),rx=rc.getContext("2d");let cols=[];
function sizeRain(){rc.width=innerWidth;rc.height=innerHeight;cols=Array(Math.ceil(innerWidth/16)).fill(0).map(()=>Math.random()*innerHeight/16)}
sizeRain();addEventListener("resize",sizeRain);
setInterval(()=>{rx.fillStyle="rgba(5,11,20,.12)";rx.fillRect(0,0,rc.width,rc.height);rx.fillStyle="#00ff9c";rx.font="14px monospace";
cols.forEach((y,k)=>{rx.fillText("01<>/{}"[Math.floor(Math.random()*7)],k*16,y*16);cols[k]=y*16>rc.height&&Math.random()>.975?0:y+1})},60);

/* confetti */
const cc=$("conf"),cx=cc.getContext("2d");let ps=[];
function confetti(){cc.width=innerWidth;cc.height=innerHeight;const cl=["#00ff9c","#27d3ff","#ffd24d","#ff4d6d","#fff"];
ps=Array.from({length:150},()=>({x:innerWidth/2,y:innerHeight/2,vx:(Math.random()-.5)*16,vy:-Math.random()*16-4,s:4+Math.random()*6,c:cl[Math.floor(Math.random()*5)],r:Math.random()*6}));
(function f(){cx.clearRect(0,0,cc.width,cc.height);ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=.2;cx.fillStyle=p.c;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillRect(0,0,p.s,p.s*.6);cx.restore()});ps=ps.filter(p=>p.y<cc.height+20);if(ps.length)requestAnimationFrame(f);else cx.clearRect(0,0,cc.width,cc.height)})()}

/* shared leaderboard on Supabase (anon key is public by design; access is limited by RLS policies) */
const SUPABASE_URL="https://ffvnldgkunwkdrhefwqq.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZmdm5sZGdrdW53a2RyaGVmd3FxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyMTI0NTIsImV4cCI6MjEwNjc4ODQ1Mn0.2eYnQbbv9PEbSlTOxExSlJorgObdLASw5v1qPGKs-xE";
const SB={apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY};
function drawBoard(list,shared,me){
  if(!SHOWLB)return "<b>🔒 ستظهر النتائج لاحقاً</b>";
  const h=`<b>🏆 لوحة صدارة ${shared?"الصف":"(هذا الجهاز فقط — تعذر الاتصال بالخادم)"}</b>`;
  const rows=list.slice(0,10).map((p,k)=>`<div class="${me&&p.name===me.name&&Math.abs(p.total-me.total)<.06?"me":""}"><span>${["🥇","🥈","🥉"][k]||(k+1)+"."} ${esc(p.name)}</span><span>${(+p.total).toFixed(1)} ث · ❌${p.errs}</span></div>`).join("");
  return list.length?h+rows:"";
}
async function loadBoard(me){
  let list,shared=true;
  if(!SESSION){$("lb1").innerHTML=$("lb").innerHTML="";return}
  try{const r=await fetch(SUPABASE_URL+"/rest/v1/scores?select=name,total,errs&session_id=eq."+SESSION+"&order=total.asc&limit=50",{headers:SB,cache:"no-store"});if(!r.ok)throw new Error(r.status);list=await r.json()}catch(e){console.warn("Supabase:",e);list=localBoard;shared=false}
  const html=drawBoard(list,shared,me);$("lb1").innerHTML=html;$("lb").innerHTML=html;
}
async function submit(me){
  try{const r=await fetch(SUPABASE_URL+"/rest/v1/scores",{method:"POST",headers:{...SB,"Content-Type":"application/json",Prefer:"return=minimal"},body:JSON.stringify({...me,session_id:SESSION})});if(!r.ok){console.warn("Supabase insert:",r.status,await r.text());return false}return true}catch(e){console.warn(e);return false}
}
async function rpc(fn,body){const r=await fetch(SUPABASE_URL+"/rest/v1/rpc/"+fn,{method:"POST",headers:{...SB,"Content-Type":"application/json"},body:JSON.stringify(body)});if(!r.ok)throw new Error(r.status);return r.json()}
function applyConfig(){
  $("rules").innerHTML=`⏳ عندك <b>${QT} ثانية</b> لكل سؤال، وانتهاء الوقت = عقوبة ${PEN_T} ثواني.<br>⏱️ كل إجابة خاطئة تضيف <b>${PEN_W} ثواني</b>.<br>🔥 كل 3 إجابات صحيحة متتالية تخصم <b>3 ثواني</b>.<br>${HINTS?`💡 عندك ${HINTS} تلميح (يحذف خيارين، +5 ثواني).`:"🚫 لا توجد تلميحات في هذه الجولة."}`;
  $("nn").textContent=N;
  $("notice").textContent=!OPEN?"🔒 اللعبة مغلقة حالياً، انتظر إشارة المعلم":(!SESSION?"⚠️ لا توجد جولة نشطة":ANN);
  $("go").disabled=!OPEN||!SESSION;$("pin").classList.toggle("hide",!PINREQ);
}
async function loadConfig(){
  try{
    const g=u=>fetch(SUPABASE_URL+"/rest/v1/"+u,{headers:SB,cache:"no-store"}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()});
    const [[s],[ss],qs,pr]=await Promise.all([g("settings?id=eq.1&select=*"),g("sessions?active=eq.true&select=id,name&limit=1"),g("questions?active=eq.true&select=q,correct,w1,w2,w3").catch(()=>[]),rpc("pin_required",{}).catch(()=>false)]);
    if(qs.length)Q=qs.map(x=>[x.q,[x.correct,x.w1,x.w2,x.w3]]);
    PINREQ=pr===true;
    if(s){QT=s.question_time;N=Math.min(s.num_questions,Q.length);PEN_W=s.wrong_penalty;PEN_T=s.timeout_penalty;HINTS=s.hints;OPEN=s.game_open;SHOWLB=s.show_leaderboard;ANN=s.announcement||""}
    N=Math.min(N,Q.length);SESSION=ss?ss.id:null;
  }catch(e){console.warn("config:",e)}
  applyConfig();
}
setInterval(async()=>{if(!$("game").classList.contains("hide"))return;await loadConfig();loadBoard()},15000);
loadConfig().then(()=>loadBoard());

/* game */
async function begin(){
  if(!OPEN||!SESSION)return;
  name=$("name").value.trim();
  if(!name){$("name").focus();$("name").placeholder="اكتب اسمك أولاً";return}
  name=name.replace(/\s+/g," ");$("go").disabled=true;
  try{
    if(PINREQ&&!(await rpc("check_pin",{p:$("pin").value.trim()}))){$("notice").textContent="❌ رمز الدخول غير صحيح";return}
    if(await rpc("name_taken",{n:name}).catch(()=>false)){$("notice").textContent="⚠️ هذا الاسم مستخدم في هذه الجولة، أضف حرفاً أو رقماً";return}
  }catch(e){$("notice").textContent="⚠️ تعذر الاتصال، حاول مرة أخرى";return}
  finally{$("go").disabled=false}
  sel=shuffle(Q).slice(0,N).map(([q,o])=>({q,o,missed:false}));
  i=0;errs=0;pen=0;streak=0;hints=HINTS;t0=Date.now();
  $("doors").innerHTML=sel.map((_,k)=>`<div class="door" id="d${k}">🔒</div>`).join("");
  show("game");render();
}
setInterval(()=>{
  if($("game").classList.contains("hide"))return;
  $("time").textContent=elapsed().toFixed(1);
  if(active){const left=Math.max(0,QT-(Date.now()-qT0)/1000);$("qt").textContent=Math.ceil(left);$("qbar").style.width=left/QT*100+"%";if(left<=0)timeout()}
},100);
function render(){
  const cur=sel[i];qT0=Date.now();active=true;
  $("n").textContent=i+1;$("err").textContent=errs;$("stk").textContent=streak;$("msg").textContent="";
  $("hint").textContent=`💡 تلميح (${hints})`;$("hint").disabled=hints<1;
  document.querySelectorAll(".door").forEach((d,k)=>d.classList.toggle("cur",k===i));
  $("q").textContent=cur.q;$("opts").innerHTML="";
  shuffle(cur.o.map((t,k)=>({t,ok:k===0}))).forEach((x,k)=>{
    const b=document.createElement("button");b.className="opt";b.textContent=x.t;b.dataset.ok=x.ok?1:0;
    b.style.animationDelay=k*.07+"s";b.onclick=()=>pick(b,x.ok);$("opts").appendChild(b);
  });
}
function lock(){document.querySelectorAll(".opt").forEach(x=>x.disabled=true);$("hint").disabled=true}
function next(){i++;i<N?render():finish()}
function hint(){
  if(hints<1||!active)return;
  const w=[...document.querySelectorAll(".opt")].filter(b=>b.dataset.ok==="0"&&!b.disabled);
  if(w.length<2)return;
  shuffle(w).slice(0,2).forEach(b=>{b.disabled=true;b.classList.add("gone")});
  hints--;pen+=5;$("hint").textContent=`💡 تلميح (${hints})`;$("hint").disabled=hints<1;
  $("msg").style.color="var(--y)";$("msg").textContent="💡 حُذف خيارين (+5 ثواني)";beep(440,.1);
}
function pick(b,ok){
  if(!active)return;
  if(ok){
    active=false;lock();b.classList.add("ok");fx($("game"),"flash");sOk();
    streak++;let m="✅ صحيح! انفتح الباب";
    if(streak%3===0){pen-=3;m+=" — 🔥 سلسلة! -3 ثواني"}
    $("stk").textContent=streak;$("msg").style.color="var(--g)";$("msg").textContent=m;
    const d=$("d"+i);d.textContent="🔓";d.classList.add("open");
    setTimeout(next,900);
  }else{
    b.classList.add("bad");b.disabled=true;errs++;streak=0;pen+=PEN_W;sel[i].missed=true;sBad();fx($("game"),"shake");
    $("err").textContent=errs;$("stk").textContent=0;
    $("msg").style.color="var(--r)";$("msg").textContent="❌ خطأ! +"+PEN_W+" ثواني عقوبة";
  }
}
function timeout(){
  active=false;lock();errs++;streak=0;pen+=PEN_T;sel[i].missed=true;sBad();fx($("game"),"shake");
  document.querySelectorAll(".opt").forEach(x=>{if(x.dataset.ok==="1")x.classList.add("ok")});
  $("err").textContent=errs;$("stk").textContent=0;$("d"+i).textContent="⏰";
  $("msg").style.color="var(--r)";$("msg").textContent="⏰ انتهى الوقت! +"+PEN_T+" ثواني";
  setTimeout(next,1600);
}
async function finish(){
  active=false;total=elapsed();const t=Math.round(total*10)/10;
  const rank=total<90?"👑 هاكر أسطوري":total<140?"🥷 خبير سايبر":total<200?"💻 محترف":"🔰 مبتدئ واعد";
  $("rank").textContent=rank;$("final").textContent=t.toFixed(1)+" ث";
  $("detail").textContent=`${name}، هربت من الغرفة بـ ${errs} أخطاء`;
  const miss=sel.filter(s=>s.missed);
  $("review").innerHTML=miss.length?miss.map(s=>`<div class="rv">${esc(s.q)}<br>✅ <span>${esc(s.o[0])}</span></div>`).join(""):"<div class='rv' style='border-color:var(--g)'>🎉 ما غلطت بأي سؤال!</div>";
  const me={name,total:t,errs};
  localBoard.push(me);localBoard.sort((a,b)=>a.total-b.total);
  show("end");sWin();confetti();
  const saved=await submit(me);if(saved===false)$("detail").textContent+=" ⚠️ لم تُحفظ نتيجتك في القائمة (الاسم مستخدم أو الجولة تغيّرت)";loadBoard(me);
}
function reset(){$("name").value="";show("start");loadBoard()}
</script>
</body>
</html>
